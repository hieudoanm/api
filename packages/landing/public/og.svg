<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- flat white background -->
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- top right: repo link -->
  <text x="1200" y="72" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" fill="#78716c">github.com/hieudoanm/api</text>

  <!-- left: wordmark, vertically centered -->
  <text x="80" y="288" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="800" fill="#1c1917" letter-spacing="-2">api</text>
  <text x="82" y="352" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="500" fill="#57534e">OpenAPI to API client collections</text>
  <text x="82" y="416" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="24" fill="#78716c">Postman  ·  Bruno  ·  Insomnia  ·  Hoppscotch  ·  REST Client</text>

  <!-- right: terminal card, vertically centered -->
  <g transform="translate(660,170)">
    <rect width="560" height="300" rx="18" fill="#020617"/>
    <circle cx="30" cy="30" r="7" fill="#f87171"/>
    <circle cx="54" cy="30" r="7" fill="#fbbf24"/>
    <circle cx="78" cy="30" r="7" fill="#34d399"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22">
      <text x="36" y="100" fill="#93c5fd">$ api convert openapi.yaml --format all</text>
      <text x="36" y="142" fill="#93c5fd">$ ls collections/</text>
      <text x="36" y="184" fill="#9ca3af">acme.postman_collection.json</text>
      <text x="36" y="226" fill="#9ca3af">acme/   acme.insomnia.json   acme.hoppscotch.json   acme.http</text>
      <text x="36" y="272" fill="#6b7280">five formats · one spec · zero accounts</text>
    </g>
  </g>
</svg>
