    Error400:
      description: Bad request. Malformed parameters or unsupported property.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: general.limit_out_of_range
                message: Limit must be an integer between 1 and 500.
    Error401:
      description: Unauthorized. Missing, invalid, expired, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description:
        Forbidden. The account is deleted, disabled, frozen, or pending
        approval; the request origin isn't in the key's allowed CORS origins; a
        paid-only field was used as a search, filter, or lookup target on a plan
        that doesn't include it; a limit above the plan's ceiling but within the
        paid maximum was requested on a non-paid plan; or the monthly quota has
        been exceeded past the soft-limit grace period.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description:
        Not found. The route doesn't match any defined endpoint, the API isn't
        active, or listing isn't supported for this API version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error405:
      description: Method not allowed. Every endpoint is GET-only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error410:
      description: Gone. The requested API version is no longer active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error429:
      description:
        Too Many Requests. Sustained traffic above the edge rate limit (20
        requests per 10 seconds) is rejected by Cloudflare before the request
        reaches the API, so this response is generated at the edge and does not
        carry the standard JSON error envelope. Back off briefly and retry. The
        IP API can also answer 429 itself when the upstream geolocation service
        is rate limiting lookups; that response does carry the standard JSON
        error envelope, with the code ip.lookup_rate_limited.
    Error502:
      description:
        Bad Gateway. The upstream IP geolocation service is unavailable (network
        failure, timeout, or a non-200 upstream status). Generic by design; no
        upstream detail is leaked. Retry shortly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: ip.lookup_unavailable
                message:
                  The IP geolocation service is currently unavailable. Please
                  try again later.
    ConvertList:
      description: Conversion result, one object per requested target currency.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConvertResponse'
          example:
